apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: morphos
  name: Morphos server
  description: Self-hosted file converter server
release:
  revision: "2"
  version: 0.6.0
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Self-hosted file converter
  category: files
  developer: Dan Vergara
  website: https://github.com/danvergara/morphos
