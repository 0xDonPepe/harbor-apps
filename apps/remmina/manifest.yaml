apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: remmina
  name: Remmina
  description: Remote access screen and file sharing
release:
  revision: "2"
  version: 1.4.35-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
endpoints:
  web:
    service: server
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: config
    composeVolume: config
    purpose: Data at /config (server)
    retention: retain
presentation:
  icon: icon.png
  tagline: Remote access screen and file sharing
  category: network
  developer: Remmina
  website: https://remmina.org
