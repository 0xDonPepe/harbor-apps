apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: seedtool
  name: Bitcoin Seed Tool
  description: A toolkit for generating, verifying, and recovering Bitcoin seeds
release:
  revision: "2"
  version: 2.3.0
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: A toolkit for generating, verifying, and recovering Bitcoin seeds
  category: finance
  developer: BitcoinQnA
  website: https://bitcoiner.guide/seed/
