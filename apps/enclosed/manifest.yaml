apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: enclosed
  name: Enclosed
  description: Minimalistic web app designed for sending private and secure notes.
release:
  revision: "1"
  version: 1.16.0-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8787
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/.data (web)
    retention: retain
presentation:
  tagline: Send private and secure notes
  category: files
  developer: Corentin Thomasset
  website: https://enclosed.cc/
