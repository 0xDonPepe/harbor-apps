apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: wordpress
  name: WordPress
  description: WordPress, Git-ified. This repository is just a mirror of the WordPress subversion repository. Please do not send pull requests. Submit pull requests to https://github.com/WordPress/wordpress-develop and patches to https://core.trac.wordpress.org/ instead.
release:
  revision: "3"
  version: 7.1.3
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
    db: infrastructure
endpoints:
  web:
    service: app
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: wordpress
    composeVolume: wordpress
    purpose: Data at /var/www/html (app)
    retention: retain
  - id: db
    composeVolume: db
    purpose: Data at /var/lib/mysql (db)
    retention: retain
presentation:
  icon: icon.png
  tagline: The open source publishing platform of choice for millions of websites worldwide
  category: other
  developer: WordPress
  website: https://wordpress.org/
