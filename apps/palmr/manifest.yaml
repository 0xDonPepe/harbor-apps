apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: palmr
  name: Palmr
  description: 🌴 Palmr. is an open-source file-sharing platform focused on privacy and security. It enables users to upload, manage, and share files with features like password protection, custom links, and access control without tracking or limitations. Designed for seamless and secure sharin
release:
  revision: "2"
  version: 3.3.2-beta
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
endpoints:
  web:
    service: server
    containerPort: 5487
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/server (server)
    retention: retain
presentation:
  icon: icon.png
  tagline: Open-Source File Transfer
  category: files
  developer: kyantech
  website: https://palmr.kyantech.com.br/
