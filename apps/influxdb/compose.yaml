services:
  influxdb:
    image: influxdb@sha256:1126a8335b2dd106c5360b9f493c365d9b548100ad68791b4b421dc9f408f8d3 # tag: 1.13.1
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - {type: volume, source: influxdb, target: "/var/lib/influxdb"}
  chronograf:
    image: chronograf@sha256:e01a840ecaf467e5b058faf985d945a1ace75a950e6064fa0218948a6e0ba069 # tag: 1.11.6
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: admin
    volumes:
      - {type: volume, source: chronograf, target: "/var/lib/chronograf"}
    depends_on:
      influxdb:
        condition: service_started
volumes:
  influxdb: {}
  chronograf: {}
