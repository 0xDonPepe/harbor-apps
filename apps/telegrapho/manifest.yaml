apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: telegrapho
  name: Telegrapho
  description: Private self-hosted realtime text bridge between your devices.
release:
  revision: "2"
  version: 1.0.1
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 3712
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Private copy and paste between your devices
  category: network
  developer: egzola
  website: https://github.com/egzola/telegrapho
