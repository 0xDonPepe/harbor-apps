apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: zen
  name: Zen
  description: Selfhosted notes app. Single golang binary, notes stored as markdown within SQLite, full-text search, very low resource usage
release:
  revision: "1"
  version: 1.5.0-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app
    composeVolume: app
    purpose: Data at /data (app)
    retention: retain
  - id: images
    composeVolume: images
    purpose: Data at /images (app)
    retention: retain
presentation:
  tagline: A simple app for focused and private note-taking
  category: files
  developer: Sheshbabu
  website: https://www.sheshbabu.com/zen/
