apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: docuseal
  name: DocuSeal
  description: Open source DocuSign alternative. Create, fill, and sign digital documents ✍️
release:
  revision: "2"
  version: 3.3.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
    db: infrastructure
endpoints:
  web:
    service: server
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app
    composeVolume: app
    purpose: Data at /data/docuseal (server)
    retention: retain
  - id: db
    composeVolume: db
    purpose: Data at /var/lib/postgresql/data (db)
    retention: retain
presentation:
  icon: icon.png
  tagline: Open source document filling and signing
  category: files
  developer: docusealco
  website: https://www.docuseal.com/
