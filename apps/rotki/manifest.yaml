apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: rotki
  name: rotki
  description: A portfolio tracking, analytics, accounting and management application that protects your privacy
release:
  revision: "1"
  version: 1.44.1
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /data (web)
    retention: retain
  - id: logs
    composeVolume: logs
    purpose: Data at /logs (web)
    retention: retain
presentation:
  tagline: Portfolio tracking, analytics, accounting and tax reporting
  category: finance
  developer: Rotki
  website: https://rotki.com
