apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: wingfit
  name: Wingfit
  description: Minimalist fitness app to plan your workouts, track your personal records and leverage smartwatch data
release:
  revision: "1"
  version: 5.3.1-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/storage (app)
    retention: retain
presentation:
  tagline: An open-source minimalist fitness app
  category: files
  developer: Kovacs
  website: https://wingfit.fr/
