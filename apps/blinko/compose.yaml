services:
  db:
    image: postgres@sha256:6e3358e46e34dae6c184f48fd06fe1b3dbf958ad5b83480031907e52b9ec2a7d # tag: 17.3
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinkouser
      POSTGRES_PASSWORD: blinkopass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -q
        - -d
        - blinko
        - -U
        - blinkouser
      interval: 10s
      timeout: 45s
      retries: 10
  app:
    image: blinkospace/blinko@sha256:31c3bc9f4fc00c82328c098c0c1120fe7fe43152a9f3cbc04b0303c32a2e60d3 # tag: 1.8.8
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blinkouser:blinkopass@db:5432/blinko
    volumes:
      - {type: volume, source: app, target: "/app/.blinko"}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
volumes:
  db: {}
  app: {}
