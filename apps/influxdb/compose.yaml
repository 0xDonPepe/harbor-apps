services:
  influxdb:
    image: influxdb@sha256:f5eb5cd107f845529dac36359527ed6448d421c5359cedbfc9d66beffcf669af # tag: 1.13.1
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - {type: volume, source: influxdb, target: "/var/lib/influxdb"}
  chronograf:
    image: chronograf@sha256:1aa585346868ef0859c507b2c8544a175ad308024765929f5df5b64a9679031d # tag: 1.11.4
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: admin
    volumes:
      - {type: volume, source: chronograf, target: "/var/lib/chronograf"}
    depends_on:
      influxdb:
        condition: service_started
volumes:
  influxdb: {}
  chronograf: {}
