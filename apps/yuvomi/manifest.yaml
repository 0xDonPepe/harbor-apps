apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: yuvomi
  name: Yuvomi
  description: Self-hosted family planner - tasks, calendars, shopping, meals, budget. Your data, your server.
release:
  revision: "1"
  version: 2.76.0
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app
    composeVolume: app
    purpose: Data at /data (web)
    retention: retain
  - id: backups
    composeVolume: backups
    purpose: Data at /backups (web)
    retention: retain
secrets:
  - id: app-seed
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - service: web
        environment: SESSION_SECRET
      - service: web
        environment: DB_ENCRYPTION_KEY
presentation:
  tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
  category: files
  developer: Ulas Kalayci
  website: https://github.com/ulsklyc/yuvomi
