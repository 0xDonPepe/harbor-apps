apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: cashu-me
  name: Cashu.me Wallet
  description: Cashu wallet PWA
release:
  revision: "2"
  version: 0.1.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: An open-source Bitcoin ecash wallet
  category: finance
  developer: cashubtc
  website: https://cashu.space
