apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: mqttx-web
  name: MQTTX Web
  description: A Powerful and All-in-One MQTT 5.0 client toolbox for Desktop, CLI and WebSocket.
release:
  revision: "2"
  version: 1.13.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Your All-in-One MQTT Client Toolbox
  category: automation
  developer: EMQ
  website: https://mqttx.app/
