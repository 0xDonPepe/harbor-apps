services:
  web:
    image: deluan/navidrome@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52 # tag: 0.64.2
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
      ND_MUSICFOLDER: "/music"
      ND_DATAFOLDER: "/data"
    volumes:
      - {type: volume, source: data, target: /data}
      - {type: volume, source: music, target: /music}
volumes:
  data: {}
  music: {}
