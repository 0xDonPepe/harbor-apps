apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: satoshi-dashboard
  name: Satoshi Dashboard
  description: Real-time Bitcoin analytics dashboard
release:
  revision: "2"
  version: 1.1.0-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8410
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/server/.runtime-cache (web)
    retention: retain
presentation:
  icon: icon.png
  tagline: Real-time Bitcoin analytics dashboard
  category: finance
  developer: Satoshi-Dashboard
  website: https://www.satoshidashboard.com
