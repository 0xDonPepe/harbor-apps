services:
  broker:
    image: redis@sha256:d6ecc832969a4827645a083da38345327b3447772fe907e7d4311c79b4e3a06e # tag: 7
    volumes:
      - {type: volume, source: redisdata, target: "/data"}
  db:
    image: postgres@sha256:46aa2ee5d664b275f05d1a963b30fff60fb422b4b594d509765c42db46d48881 # tag: 16
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - {type: volume, source: pgdata, target: "/var/lib/postgresql/data"}
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207 # tag: 3.3.0
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_ADMIN_USER: admin
    volumes:
      - {type: volume, source: data, target: "/usr/src/paperless/data"}
      - {type: volume, source: media, target: "/usr/src/paperless/media"}
      - {type: volume, source: paperless-export, target: "/usr/src/paperless/export"}
      - {type: volume, source: paperless-consume, target: "/usr/src/paperless/consume"}
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_started
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    healthcheck:
      disable: true
  gotenberg:
    image: gotenberg/gotenberg@sha256:d03b8a04c6e6c5e568b38f57352266dee4674849b71818774025f8f48d869a9a # tag: 7.10
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
  tika:
    image: apache/tika@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973 # tag: 3.3.1.0
volumes:
  redisdata: {}
  pgdata: {}
  data: {}
  media: {}
  paperless-export: {}
  paperless-consume: {}
