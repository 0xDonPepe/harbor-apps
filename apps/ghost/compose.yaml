services:
  web:
    image: ghost@sha256:55131b90d48c3cecae6c085f873b2067542ababd286b12d08474b2b34328e266 # tag: 6.69.0
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: umbrel
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
    volumes:
      - {type: volume, source: content, target: "/var/lib/ghost/content"}
  db:
    image: mysql@sha256:339598fe066c73daa4120f2d9dfefd3146c3519cd324748e1d3f9d2b6c71d10b # tag: 8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: umbrel
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  content: {}
  db: {}
