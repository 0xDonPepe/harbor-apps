services:
  postgres:
    image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # tag: 16.15
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
    healthcheck:
      test: [CMD, pg_isready, -U, n8n, -d, n8n]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - {type: volume, source: database, target: /var/lib/postgresql/data}
  web:
    image: n8nio/n8n@sha256:5032941f437e1daa421cad0cc3ea57cd054f0d44a7256b38a0a3fca1b460834a # tag: 2.44.3
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_SCHEMA: public
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - {type: volume, source: app-state, target: /home/node/.n8n}
volumes:
  database: {}
  app-state: {}
