apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: element
  name: Element
  description: A glossy Matrix collaboration client for the web.
release:
  revision: "3"
  version: "1.12.31"
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: A glossy Matrix client compatible with Synapse
  category: other
  developer: New Vector Ltd
  website: https://element.io
