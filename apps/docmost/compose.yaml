services:
  web:
    image: docmost/docmost@sha256:b56947fcfd08aab8fae12a377e1792784786adbf8b96e4281f14ef4fc072685a # tag: 0.96.0
    environment:
      DATABASE_URL: postgresql://docmostuser:docmostpass@db:5432/docmost?sslmode=disable
      REDIS_URL: redis://redis:6379
      DISABLE_TELEMETRY: "true"
    volumes:
      - {type: volume, source: docmost-data, target: "/app/data/storage"}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
  db:
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # tag: 17.11
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmostuser
      POSTGRES_PASSWORD: docmostpass
    volumes:
      - {type: volume, source: db-data, target: "/var/lib/postgresql/data"}
  redis:
    image: redis@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6 # tag: 8.10.2
    volumes:
      - {type: volume, source: redis-data, target: "/data"}
volumes:
  docmost-data: {}
  db-data: {}
  redis-data: {}
