apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: localai
  name: LocalAI
  description: LocalAI is the open-source AI engine. Run any model - LLMs, vision, voice, image, video - on any hardware. No GPU required.
release:
  revision: "1"
  version: 4.11.0
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    api: application
endpoints:
  web:
    service: api
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: models
    composeVolume: models
    purpose: Data at /models (api)
    retention: retain
  - id: backends
    composeVolume: backends
    purpose: Data at /backends (api)
    retention: retain
  - id: data
    composeVolume: data
    purpose: Data at /data (api)
    retention: retain
  - id: configuration
    composeVolume: configuration
    purpose: Data at /configuration (api)
    retention: retain
  - id: images
    composeVolume: images
    purpose: Data at /tmp/generated/images (api)
    retention: retain
presentation:
  tagline: Drop-in OpenAI replacement
  category: ai
  developer: Ettore Di Giacinto
  website: https://localai.io/
