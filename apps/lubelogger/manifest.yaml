apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: lubelogger
  name: LubeLogger
  description: LubeLogger is a web-based vehicle maintenance and fuel mileage tracker
release:
  revision: "1"
  version: 1.7.3-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app
    composeVolume: app
    purpose: Data at /App/data (app)
    retention: retain
  - id: keys
    composeVolume: keys
    purpose: Data at /root/.aspnet/DataProtection-Keys (app)
    retention: retain
presentation:
  tagline: A vehicle maintenance and fuel mileage tracker
  category: files
  developer: Hargata Softworks
  website: https://lubelogger.com/
