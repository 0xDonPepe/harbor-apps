apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: libreoffice
  name: LibreOffice
  description: Do more - easier, quicker, smarter
release:
  revision: "1"
  version: 7.6.7-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
endpoints:
  web:
    service: server
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: config
    composeVolume: config
    purpose: Data at /config (server)
    retention: retain
presentation:
  tagline: Do more - easier, quicker, smarter
  category: files
  developer: The Document Foundation
  website: https://www.libreoffice.org/
