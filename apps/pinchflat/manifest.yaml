apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: pinchflat
  name: Pinchflat
  description: Your next YouTube media manager
release:
  revision: "1"
  version: 2025.6.6-patch.1
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8945
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: config
    composeVolume: config
    purpose: Data at /config (web)
    retention: retain
  - id: downloads
    composeVolume: downloads
    purpose: Data at /downloads (web)
    retention: retain
    external:
      hint: "Optional: a folder on this machine to use for /downloads, such as a folder on a large drive"
      required: false
presentation:
  tagline: A automated media backup solution, for online media sources
  category: media
  developer: Kieran Eglin
  website: https://github.com/kieraneglin/pinchflat
