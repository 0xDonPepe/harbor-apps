services:
  web:
    image: anirdev/slink@sha256:2cc66542a4be2b08a13e1215fd58064179331eaa5fdeef36edc66b2f43313de8 # tag: v1.14.2
    environment:
      TZ: UTC
      REQUIRE_SSL: "false"
      USER_APPROVAL_REQUIRED: "false"
      USER_PASSWORD_MIN_LENGTH: "8"
      USER_PASSWORD_REQUIREMENTS: "15"
      IMAGE_MAX_SIZE: 15M
      IMAGE_STRIP_EXIF_METADATA: "true"
      IMAGE_COMPRESSION_QUALITY: "80"
      STORAGE_PROVIDER: local
    volumes:
      - {type: volume, source: var, target: "/app/var/data"}
      - {type: volume, source: images, target: "/app/slink/images"}
    healthcheck:
      disable: true
volumes:
  var: {}
  images: {}
