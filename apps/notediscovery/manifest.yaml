apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: notediscovery
  name: NoteDiscovery
  description: Your Self-Hosted Knowledge Base
release:
  revision: "1"
  version: 0.31.7
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/data (web)
    retention: retain
presentation:
  tagline: A lightweight, privacy-focused note-taking application
  category: files
  developer: Guillermo Villar
  website: https://www.notediscovery.com/
