apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: nutstash-wallet
  name: Nutstash Wallet
  description: Cashu Wallet with multi-mint and send-to-nostr-key functionality
release:
  revision: "2"
  version: 0.1.10
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Nutstash is a Cashu wallet for your browser
  category: finance
  developer: gandlafbtc
  website: https://nutstash.app/
