apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: fizzy
  name: Fizzy
  description: Kanban as it should be. Not as it has been.
release:
  revision: "1"
  version: 5f45e54-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
endpoints:
  web:
    service: server
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app
    composeVolume: app
    purpose: Data at /rails/storage (server)
    retention: retain
secrets:
  - id: app-seed
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - service: server
        environment: SECRET_KEY_BASE
presentation:
  tagline: Kanban as it should be. Not as it has been.
  category: other
  developer: 37signals
  website: https://www.fizzy.do
