services:
  app:
    image: stirlingtools/stirling-pdf@sha256:10164ffe04961b02ebc9fa4da12064eeacb8d3bc3e09ceb059f78ce7aaa83207 # tag: 3.2.0
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "true"
      LANGS: ALL
      SECURITY_ENABLELOGIN: "false"
    volumes:
      - {type: volume, source: tessdata, target: "/usr/share/tessdata"}
      - {type: volume, source: configs, target: "/configs"}
      - {type: volume, source: logs, target: "/logs"}
      - {type: volume, source: pipeline, target: "/pipeline"}
    healthcheck:
      disable: true
volumes:
  tessdata: {}
  configs: {}
  logs: {}
  pipeline: {}
