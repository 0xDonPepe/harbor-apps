services:
  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551 # tag: 0.34.4
    # OLLAMA_IGPU_ENABLE admits integrated Intel/AMD graphics (Vulkan, on by default in this release), which Ollama
    # drops otherwise; it does not change a discrete NVIDIA card.
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_IGPU_ENABLE: "1"
    volumes:
      - {type: volume, source: models, target: /root/.ollama}
  web:
    image: ghcr.io/open-webui/open-webui@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def # tag: v0.12.3
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: "pending"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    depends_on:
      ollama: {condition: service_started}
    volumes:
      - {type: volume, source: data, target: /app/backend/data}
volumes:
  data: {}
  models: {}
