services:
  web:
    image: anirdev/slink@sha256:dd2af33782a4bf16b1445c74c8354593a0a810585ae4a65cf6a0263edab10835 # tag: v1.14.3
    environment:
      TZ: UTC
      REQUIRE_SSL: "false"
      USER_APPROVAL_REQUIRED: "false"
      USER_PASSWORD_MIN_LENGTH: "8"
      USER_PASSWORD_REQUIREMENTS: "15"
      IMAGE_MAX_SIZE: 15M
      IMAGE_STRIP_EXIF_METADATA: "true"
      IMAGE_COMPRESSION_QUALITY: "80"
      STORAGE_PROVIDER: local
    volumes:
      - {type: volume, source: var, target: "/app/var/data"}
      - {type: volume, source: images, target: "/app/slink/images"}
    healthcheck:
      disable: true
volumes:
  var: {}
  images: {}
