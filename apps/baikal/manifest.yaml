apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: baikal
  name: Baikal
  description: Baïkal is a Calendar+Contacts server
release:
  revision: "2"
  version: 0.11.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: config
    composeVolume: config
    purpose: Data at /var/www/baikal/config (web)
    retention: retain
  - id: specific
    composeVolume: specific
    purpose: Data at /var/www/baikal/Specific (web)
    retention: retain
presentation:
  icon: icon.png
  tagline: A lightweight calendar and contacts server
  category: network
  developer: fruux GmbH
  website: https://sabre.io/baikal/
