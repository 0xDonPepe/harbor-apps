apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: akaunting
  name: Akaunting
  description: Online Accounting Software
provisionedCredentials:
  service: app
  passwordEnv: ADMIN_PASSWORD
  username: umbrel@umbrel.local
release:
  revision: "2"
  version: 3.1.21
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
    db: infrastructure
endpoints:
  web:
    service: app
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: db
    composeVolume: db
    purpose: Data at /var/lib/mysql (db)
    retention: retain
presentation:
  icon: icon.png
  tagline: An intuitive accounting solution for small businesses and freelancers
  category: finance
  developer: Akaunting Inc.
  website: https://akaunting.com/
