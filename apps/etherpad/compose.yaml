services:
  app:
    image: etherpad/etherpad@sha256:c5f4a44406fab46238ce8ea9a0fbf92b3f83a8fd079ec016ded8fdb7f4986d09 # tag: 3.3.8
    environment:
      NODE_ENV: production
      CI: "true"
      DB_CHARSET: utf8mb4
      DB_HOST: postgres
      DB_NAME: etherpad
      DB_PASS: admin
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_USER: admin
      DEFAULT_PAD_TEXT: ""
      DISABLE_IP_LOGGING: "false"
      LOGLEVEL: INFO
      SOFFICE: ""
      ALLOW_UNKNOWN_FILE_ENDS: "true"
      TRUST_PROXY: "true"
      SKIN_NAME: colibris
      SKIN_VARIANTS: super-light-toolbar super-light-editor light-background
      SHOW_SETTINGS_IN_ADMIN_PAGE: "true"
      SUPPRESS_ERRORS_IN_PAD_TEXT: "false"
    volumes:
      - {type: volume, source: plugins, target: "/opt/etherpad-lite/src/plugin_packages"}
      - {type: volume, source: etherpad-var, target: "/opt/etherpad-lite/var"}
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      disable: true
  postgres:
    image: postgres@sha256:93a6166360be8f1d116b7ea97ebb8dea9e2c9c746349e952738bbba72a961d7c # tag: 15-alpine
    environment:
      POSTGRES_DB: etherpad
      POSTGRES_PASSWORD: admin
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - {type: volume, source: postgres-data, target: "/var/lib/postgresql/data/pgdata"}
volumes:
  plugins: {}
  etherpad-var: {}
  postgres-data: {}
