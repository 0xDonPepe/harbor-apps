apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: omnitools
  name: OmniTools
  description: Self-hosted collection of powerful web-based tools for everyday tasks. No ads, no tracking, just fast, accessible utilities right from your browser!
release:
  revision: "2"
  version: 0.6.0
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: An all-in-one collection of powerful web-based tools for everyday tasks
  category: files
  developer: Ibrahima Gaye Coulibaly
  website: https://omnitools.app/
