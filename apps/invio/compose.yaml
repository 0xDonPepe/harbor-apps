services:
  backend:
    image: ghcr.io/kittendevv/invio-backend@sha256:402c3b2255021834fefeeaaae32cd0f68563a2205dbd6b99914a42cf89e699b5 # tag: v2.2.0
    environment:
      ADMIN_USER: admin
      SESSION_TTL_SECONDS: "43200"
      SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "true"
      DATABASE_PATH: /app/data/invio.db
    volumes:
      - {type: volume, source: data, target: "/app/data"}
  frontend:
    image: ghcr.io/kittendevv/invio-frontend@sha256:b2a48dc3bfa04771a2b658905268dfc766958c72be6f783f141e313c189c61b8 # tag: v2.2.0
    environment:
      PORT: "8000"
      BACKEND_URL: http://backend:3000
      COOKIE_SECURE: "false"
      FRONTEND_SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "false"
    depends_on:
      backend:
        condition: service_started
volumes:
  data: {}
