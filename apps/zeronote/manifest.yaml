apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: zeronote
  name: ZeroNote
  description: ZeroNote is an open-source, offline-first unified app that replaces your password manager, bookmark manager, notes app, and 2FA authenticator with a single encrypted note-taking system powered by smart tags, where everything is stored locally on your device with zero-knowledge en
release:
  revision: "1"
  version: 1.0.12
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  tagline: All your notes, passwords, bookmarks, and 2FA in one secure, offline-first app
  category: files
  developer: besoeasy
  website: https://github.com/besoeasy/zeronote
