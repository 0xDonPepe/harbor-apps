apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: mstream
  name: mStream
  description: The easiest music streaming server available
release:
  revision: "2"
  version: 6.31.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
endpoints:
  web:
    service: server
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /config (server)
    retention: retain
  - id: downloads-music
    composeVolume: downloads-music
    purpose: Data at /music (server)
    retention: retain
    external:
      hint: "Optional: a folder on this machine to use for /music, such as a folder on a large drive"
      required: false
presentation:
  icon: icon.png
  tagline: A private music server
  category: media
  developer: Iros Software
  website: https://mstream.io/
