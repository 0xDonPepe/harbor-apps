# Verify every change with Harbor's own loader; publish every change to main as a catalog release.
# Harbor boxes download releases/latest/download/{catalog.zip,catalog.json} over HTTPS. There is no signature
# (Harbor decision 158): trust is HTTPS to GitHub, exactly like Harbor's own self-update. catalog.json pins
# catalog.zip by sha256 and size: an integrity check against truncated or mixed downloads, not a trust anchor.
#
# Two jobs:
#   verify   every PR, manual run, and main push touching apps/, .harbor-ref or this file: Harbor's tools at the commit pinned in .harbor-ref check every app.
#   release  main push/dispatch only: bundles with Harbor's tools at that commit, creates release c<serial>
#            and marks it latest. The write token reaches only the two gh steps (never git, never pnpm).
# Never put ${{ }} of commit or package text inside a run: script; pass values through env and quote them.
name: catalog
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.harbor-ref'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail: a failing command in a pipe fails the step

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      harbor_ref: ${{ steps.harbor.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read Harbor ref
        id: harbor
        run: |
          ref=$(tr -d '[:space:]' < .harbor-ref)
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.harbor-ref::.harbor-ref must hold one full 40-hex commit sha of carlosalaniz/harbor (a commit on its main), not \"$ref\". Branches and tags move; the tools that check and bundle the catalog must not. See README.md, \"Bumping .harbor-ref\"."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: carlosalaniz/harbor
          ref: ${{ steps.harbor.outputs.ref }}
          path: .harbor
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: .harbor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .harbor
      - name: Validate every app as Harbor loads it
        run: pnpm catalog:verify "$GITHUB_WORKSPACE/apps" --quiet
        working-directory: .harbor
      - name: release.json hashes are current
        run: pnpm catalog:hash --catalog "$GITHUB_WORKSPACE/apps" --check
        working-directory: .harbor

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    # One release at a time, so two runs never both decide "no release yet" for the same serial. This does
    # not order runs by commit: an older run that gets here after a newer release skips (see Decide).
    concurrency:
      group: catalog-release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Serial
        id: serial
        run: |
          serial=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [[ ! "$serial" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::could not read HEAD's committer time (got \"$serial\")"
            exit 1
          fi
          # Harbor only ever moves to a higher serial: a future-dated commit would freeze every box until
          # the clock caught up, so refuse anything more than 5 minutes ahead of the runner's clock.
          if (( serial > now + 300 )); then
            echo "::error::HEAD's committer time ($serial, $(date -u -d "@$serial" +%FT%TZ)) is more than 5 minutes in the future (runner clock $(date -u -d "@$now" +%FT%TZ)). Fix the clock and make a new commit."
            exit 1
          fi
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: carlosalaniz/harbor
          ref: ${{ needs.verify.outputs.harbor_ref }}
          path: .harbor
          fetch-depth: 0
          persist-credentials: false
      - name: The pinned Harbor commit is on Harbor's main
        env:
          HARBOR_REF: ${{ needs.verify.outputs.harbor_ref }}
        run: |
          if ! git -C .harbor merge-base --is-ancestor "$HARBOR_REF" origin/main; then
            echo "::error file=.harbor-ref::$HARBOR_REF is not on carlosalaniz/harbor main; only reviewed Harbor commits may build a published catalog."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: .harbor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .harbor
      - name: Bundle
        working-directory: .harbor
        env:
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/dist"
          pnpm -s catalog:bundle "$GITHUB_WORKSPACE/apps" --out "$GITHUB_WORKSPACE/dist" --commit "$GITHUB_SHA" --serial "$SERIAL" | tee "$GITHUB_WORKSPACE/bundle.log"
          mv "$GITHUB_WORKSPACE/bundle.log" "$GITHUB_WORKSPACE/dist/bundle.log"
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          if [[ ! "$SERIAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::bad serial \"$SERIAL\""
            exit 1
          fi
          tag="c$SERIAL"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # 1. The tag exists: a re-run of this commit is fine, a different commit in the same second is not.
          exists=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq "any(.[]; .ref == \"refs/tags/$tag\")")
          if [[ "$exists" == "true" ]]; then
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag was already released from $tagged; $GITHUB_SHA has the same committer second as an existing release, and Harbor would never pick it up. Make a new commit."
              exit 1
            fi
            assets=$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(" ")' 2>/dev/null || true)
            if [[ "$assets" != "catalog.json catalog.zip" ]]; then
              echo "::error::$tag exists for this commit but its release is incomplete (assets: \"$assets\"). Delete the release and the tag, then re-run this workflow."
              exit 1
            fi
            echo "::notice::$tag is already released from this commit; nothing to do"
            exit 0
          fi

          # 2. A release at least as new exists: fine when a newer commit replaced this one, clock skew otherwise.
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ "$latest" =~ ^c([0-9]+)$ ]] && (( BASH_REMATCH[1] >= SERIAL )); then
            tip=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$tip" != "$GITHUB_SHA" ]]; then
              echo "::notice::$latest is newer than $tag and main has moved on to $tip; that commit publishes the catalog"
              exit 0
            fi
            echo "::error::HEAD's committer time ($SERIAL) is not newer than the latest release $latest; Harbor would never pick it up. Check the committer's clock and make a new commit."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          {
            echo "App catalog for Harbor, built from ${GITHUB_SHA}."
            echo
            echo "Apps (id, revision, version, oldest Harbor that can run it):"
            echo
            # bundle.log lines: `ok   <id>@<rev>[ (<version>)][ minHarbor=<x.y.z>]`
            awk '$1 == "ok" {
              split($2, a, "@"); v = ""; m = ""; inv = 0
              for (i = 3; i <= NF; i++) {
                if (!inv && v == "" && substr($i, 1, 1) == "(") inv = 1
                if (inv) { v = (v == "" ? $i : v " " $i); if (substr($i, length($i), 1) == ")") inv = 0; continue }
                if (index($i, "minHarbor=") == 1) m = substr($i, 11)
              }
              if (v != "") v = substr(v, 2, length(v) - 2)
              print "- " a[1] " r" a[2] (v != "" ? " (" v ")" : "") (m != "" ? " needs Harbor " m "+" : "")
            }' dist/bundle.log
          } > notes.md
          title="Catalog $(date -u -d "@$SERIAL" +%Y-%m-%d) (${GITHUB_SHA:0:12})"
          gh release create "$TAG" dist/catalog.zip dist/catalog.json \
            --target "$GITHUB_SHA" --latest \
            --title "$title" \
            --notes-file notes.md
