apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: chatpad-ai
  name: Chatpad AI
  description: Not just another ChatGPT user-interface!
release:
  revision: "2"
  version: bb5f4a
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Premium quality UI for ChatGPT
  category: ai
  developer: Andrei Canta
  website: https://github.com/deiucanta/chatpad
