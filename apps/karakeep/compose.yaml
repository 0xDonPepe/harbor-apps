services:
  meilisearch:
    # Stay on the version Karakeep's own docker-compose.yml names (harbor-apps updates.json holds this
    # service). The dumpless upgrade opens an older index in place, and that cannot be undone: an index a
    # newer Meilisearch has upgraded refuses to open in an older one, which then does not start. The way
    # back is to empty this volume, start again, and rebuild the index in Karakeep (Admin, Background jobs,
    # Reindex all bookmarks).
    image: getmeili/meilisearch@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db # tag: v1.41.0
    environment:
      MEILI_ENV: "production"
      MEILI_NO_ANALYTICS: "true"
      MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: "true"
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: meilisearch, target: /meili_data}
  chrome:
    # Karakeep's own headless browser: Google Chrome on amd64, Debian's Chromium on arm64. Its entrypoint adds
    # --headless, --no-sandbox and the DevTools forward from 9222 (socat) to Chrome on 9223. The first five
    # flags are the ones Karakeep's docker-compose.yml passes; the last four turn off most of the browser's own
    # background traffic to Google (component and list updates, sync, Domain Reliability reports). A launcher
    # such as Playwright adds them itself, but Karakeep attaches to this browser instead of launching one.
    # Nothing is kept between restarts (the profile lives in /tmp).
    image: ghcr.io/karakeep-app/karakeep-chrome@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa # tag: 154.0.8037.57-r1
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
      - --disable-background-networking
      - --disable-component-update
      - --disable-domain-reliability
      - --disable-sync
    healthcheck:
      # One DevTools request through the forwarder: healthy only when socat and Chrome both answer. HTTP/1.1
      # (Chrome refuses 1.0) and shut-none (Chrome drops a request whose sender half-closes before the answer).
      test: [CMD, sh, -c, 'printf "GET /json/version HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" | socat -t 5 - TCP4:127.0.0.1:9222,shut-none | grep -q webSocketDebuggerUrl']
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
  web:
    # The all-in-one image: s6 runs the database migration, then the web app and the background workers
    # (crawler, search indexing, AI tagging, feeds).
    image: ghcr.io/karakeep-app/karakeep@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c # tag: 0.33.2
    environment:
      DATA_DIR: "/data"
      MEILI_ADDR: "http://meilisearch:7700"
      BROWSER_WEB_URL: "http://chrome:9222"
      DISABLE_NEW_RELEASE_CHECK: "true"
      LOG_LEVEL: "info"
      # Used only when the Ollama link is set (OLLAMA_BASE_URL). Karakeep never downloads models itself:
      # pull this one into Ollama first (README). gemma3:4b reads images too, so one model covers both.
      INFERENCE_TEXT_MODEL: "gemma3:4b"
      INFERENCE_IMAGE_MODEL: "gemma3:4b"
      INFERENCE_JOB_TIMEOUT_SEC: "300"
    depends_on:
      # Started, not healthy, as in Karakeep's own compose (no depends_on there): bookmarks keep working
      # while search is down, and Karakeep connects to Meilisearch again on the next search or index job.
      meilisearch: {condition: service_started}
      chrome: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    volumes:
      - {type: volume, source: data, target: /data}
volumes:
  data: {}
  meilisearch: {}
