apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: trip
  name: Trip
  description: 🗺️ Minimalist POI Map Tracker and Trip Planner. Self-hosted.
release:
  revision: "2"
  version: 1.50.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app
    composeVolume: app
    purpose: Data at /app/storage (app)
    retention: retain
presentation:
  icon: icon.png
  tagline: Minimalist Map Tracker and Trip Planner
  category: files
  developer: itskovacs
  website: https://itskovacs-trip.netlify.app/
