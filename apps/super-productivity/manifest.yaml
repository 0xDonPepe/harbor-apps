apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: super-productivity
  name: Super Productivity
  description: Super Productivity is an advanced todo list app with integrated Timeboxing and time tracking capabilities. It also comes with integrations for Jira, GitLab, GitHub and Open Project.
release:
  revision: "2"
  version: 19.2.0
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: An efficient way to manage tasks, time, and projects all in one place
  category: files
  developer: Johannes Schickling
  website: https://super-productivity.com/
