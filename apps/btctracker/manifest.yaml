apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: btctracker
  name: BTC Tracker
  description: Self-hosted tracker of your BTC investments!
release:
  revision: "2"
  version: 0.7.0-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/data (web)
    retention: retain
secrets:
  - id: app-seed
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - service: web
        environment: NEXTAUTH_SECRET
configuration:
  - service: web
    environment: NEXTAUTH_URL
    endpoint: web
    format: origin
presentation:
  icon: icon.png
  tagline: A simple, privacy-focused Bitcoin investment tracker
  category: finance
  developer: wilqq-the
  website: https://github.com/wilqq-the
