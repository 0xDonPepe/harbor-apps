services:
  app:
    image: ghcr.io/swingmx/swingmusic@sha256:a49155d1809bc6ad09d87d76cc91648c149fc80146b5e10260e70fe1cfa78175 # tag: v3.0.0
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - {type: volume, source: config, target: "/config"}
      - {type: volume, source: music, target: "/music"}
      - {type: volume, source: downloads, target: "/downloads"}
volumes:
  config: {}
  music: {}
  downloads: {}
