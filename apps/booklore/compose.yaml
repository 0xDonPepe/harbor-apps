services:
  web:
    image: ghcr.io/booklore-app/booklore@sha256:f92dae443c38098bf8348742465f6f3b17b619cb8f0e5c2cf195dcdfbb88eaeb # tag: v2.4.0
    environment:
      DATABASE_URL: jdbc:mariadb://db:3306/booklore
      DATABASE_USERNAME: bookloreuser
      DATABASE_PASSWORD: booklorepass
    volumes:
      - {type: volume, source: app, target: "/app/data"}
      - {type: volume, source: books, target: "/books"}
      - {type: volume, source: bookdrop, target: "/bookdrop"}
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:b30cc65b57a11a2e791ad5c06284e599fe9f1bf3fe9081a88d85bcf36389be4a # tag: 12.0.2
    environment:
      MARIADB_DATABASE: booklore
      MARIADB_USER: bookloreuser
      MARIADB_PASSWORD: booklorepass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  app: {}
  books: {}
  bookdrop: {}
  db: {}
