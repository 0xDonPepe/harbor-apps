services:
  server:
    image: bellamy/wallos@sha256:0006879778f31a962a3873f7682514b92a3c7665dcbc4764fcc241ad968eaccd # tag: 5.8.3
    environment:
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1000"
    volumes:
      - {type: volume, source: db, target: "/var/www/html/db"}
      - {type: volume, source: logos, target: "/var/www/html/images/uploads/logos"}
    healthcheck:
      disable: true
volumes:
  db: {}
  logos: {}
