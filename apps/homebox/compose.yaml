services:
  web:
    image: ghcr.io/sysadminsmedia/homebox@sha256:b1ad7e3c63f732a5f6daa466e8116be4f545b3b120383a64dcb62beb00a660cc # tag: 0.26.2
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_WEB_MAX_UPLOAD_SIZE: "10"
    volumes:
      - {type: volume, source: data, target: "/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
