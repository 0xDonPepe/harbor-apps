apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: gupt
  name: Gupt
  description: Self-hosted, end-to-end encrypted messenger. A privacy-first alternative to Telegram, Signal, WhatsApp & Discord.
release:
  revision: "2"
  version: 5.0.33
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Encrypted chat, passwords, notes, bookmarks, and ephemeral sharing
  category: other
  developer: besoeasy
  website: https://github.com/besoeasy/gupt
