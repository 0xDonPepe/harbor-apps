apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: changedetection-io
  name: changedetection.io
  description: Best and simplest tool for website change detection, web page monitoring, and website change alerts. Perfect for tracking content changes, price drops, restock alerts, and website defacement monitoring—all for free or enjoy our SaaS plan!
release:
  revision: "2"
  version: 0.60.8
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 5000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /datastore (app)
    retention: retain
configuration:
  - service: app
    environment: BASE_URL
    endpoint: web
    format: origin
presentation:
  icon: icon.png
  tagline: Website change detection and alerts
  category: automation
  developer: dgtlmoon
  website: https://changedetection.io/
