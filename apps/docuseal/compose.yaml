services:
  server:
    image: docuseal/docuseal@sha256:fcfa6b2dbf6d8847396f59f8af9591785c66152154337a54d1c1748b4d9366b3 # tag: 3.3.2
    environment:
      DATABASE_URL: postgresql://docusealuser:docusealpass@db:5432/docuseal?sslmode=disable
    volumes:
      - {type: volume, source: app, target: "/data/docuseal"}
    depends_on:
      db:
        condition: service_started
  db:
    image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # tag: 17.11
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
volumes:
  app: {}
  db: {}
