apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: passky-client
  name: Passky Client
  description: Website for Passky (password manager)
release:
  revision: "1"
  version: 8.1.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  tagline: Simple, modern, lightweight, open source and secure password manager
  category: files
  developer: Rabbit Company LLC
  website: https://passky.org
