apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: dropgate-server
  name: Dropgate Server
  description: A self-hosted, privacy-first file sharing system with both hosted upload and direct P2P transfer capabilities.
release:
  revision: "1"
  version: 3.0.13-patch.1
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 52443
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: uploads
    composeVolume: uploads
    purpose: Data at /usr/src/app/uploads (web)
    retention: retain
presentation:
  tagline: Self-hosted, privacy-first file sharing with hosted upload and P2P transfer
  category: files
  developer: Diamond Digital Development
  website: https://diamonddigital.dev/projects/dropgate
