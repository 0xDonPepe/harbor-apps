apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: perplexica
  name: Vane
  description: Vane is an AI-powered answering engine.
release:
  revision: "3"
  version: 1.12.2-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: app-data
    composeVolume: app-data
    purpose: Data at /home/perplexica/data (web)
    retention: retain
  - id: uploads
    composeVolume: uploads
    purpose: Data at /home/perplexica/uploads (web)
    retention: retain
# Optional: the shared Ollama app. Vane reads OLLAMA_BASE_URL at every start and adds an Ollama provider with that
# address when it has none with the same settings (Settings, Model providers). Without a provider nothing changes.
links:
  - id: ollama
    purpose: "Ollama, the model server (shared by every AI app; optional)"
    optional: true
    provider:
      packages: [ollama]
      endpoint: web
    bindings:
      - {service: web, environment: OLLAMA_BASE_URL, format: url}
presentation:
  icon: icon.png
  tagline: An AI-powered answering engine
  category: ai
  developer: Kushagra Srivastava
  website: https://github.com/ItzCrazyKns/Vane
  releaseNotes: "Vane 1.12.2. Can link to the Ollama app for local models (optional): it then appears under Settings, Model providers."
