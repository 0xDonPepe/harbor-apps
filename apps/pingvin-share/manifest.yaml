apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: pingvin-share
  name: Pingvin Share
  description: A self-hosted file sharing platform that combines lightness and beauty, perfect for seamless and efficient file sharing.
release:
  revision: "2"
  version: 1.13.0
  minHarbor: 0.28.4
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: backend
    composeVolume: backend
    purpose: Data at /opt/app/backend/data (web)
    retention: retain
  - id: images
    composeVolume: images
    purpose: Data at /opt/app/frontend/public/img (web)
    retention: retain
presentation:
  icon: icon.png
  tagline: Self-hosted file sharing platform
  category: files
  developer: Elias Schneider
  website: https://stonith404.github.io/pingvin-share/introduction
