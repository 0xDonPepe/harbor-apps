apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: leafwiki
  name: LeafWiki
  description: LeafWiki - Self-hosted wiki. Single Go binary, SQLite, Markdown on disk. No external database required.
provisionedCredentials:
  service: web
  passwordEnv: LEAFWIKI_ADMIN_PASSWORD
  username: admin
release:
  revision: "2"
  version: 0.14.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /app/data (web)
    retention: retain
secrets:
  - id: app-seed
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - service: web
        environment: LEAFWIKI_JWT_SECRET
presentation:
  icon: icon.png
  tagline: A real wiki app without the heavy stack
  category: files
  developer: perber
  website: https://leafwiki.com/
