services:
  proxy:
    image: reallibrephotos/librephotos-proxy@sha256:050acd28b16749e6f614174ea3557b6be9dfc063721ded8ea70d44b9458f6eef # tag: 2026w25
    volumes:
      - {type: volume, source: photos, target: "/data"}
      - {type: volume, source: protected-media, target: "/protected_media"}
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
  db:
    image: pgautoupgrade/pgautoupgrade@sha256:30327dd262e3ec44df14e1120f99aac56eb3c60b49ab36d3095a25b5cf187158 # tag: 17-alpine3.24
    environment:
      POSTGRES_USER: librephotos
      POSTGRES_PASSWORD: librephotos
      POSTGRES_DB: librephotos
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
    healthcheck:
      test:
        - CMD
        - psql
        - -U
        - librephotos
        - -d
        - librephotos
        - -c
        - SELECT 1;
      interval: 5s
      timeout: 5s
      retries: 5
  frontend:
    image: reallibrephotos/librephotos-frontend@sha256:7cef7bdec16ac9193be9396d1be5daba5fa648663bb551de1fd5ace8e16fdc6c # tag: 2026w25
  backend:
    image: reallibrephotos/librephotos@sha256:e9f6b494df44f554c349f17dd4c544614534aba74042ff97cb3afaa3d2e44763 # tag: 2026w25
    environment:
      BACKEND_HOST: backend
      ADMIN_EMAIL: admin@admin.com
      ADMIN_USERNAME: admin
      DB_BACKEND: postgresql
      DB_NAME: librephotos
      DB_USER: librephotos
      DB_PASS: librephotos
      DB_HOST: db
      DB_PORT: "5432"
      MAPBOX_API_KEY: ""
      WEB_CONCURRENCY: "2"
      HEAVYWEIGHT_PROCESS: "1"
      FIXPERMISSIONS: "true"
      SKIP_PATTERNS: ""
      ALLOW_UPLOAD: "true"
      CSRF_TRUSTED_ORIGINS: ""
      DEBUG: "0"
    volumes:
      - {type: volume, source: photos, target: "/data"}
      - {type: volume, source: protected-media, target: "/protected_media"}
      - {type: volume, source: logs, target: "/logs"}
      - {type: volume, source: cache, target: "/root/.cache"}
    depends_on:
      db:
        condition: service_healthy
volumes:
  photos: {}
  protected-media: {}
  db: {}
  logs: {}
  cache: {}
