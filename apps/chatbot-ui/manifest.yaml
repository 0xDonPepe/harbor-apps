apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: chatbot-ui
  name: ChatBot UI
  description: AI chat for any model.
release:
  revision: "1"
  version: 2023.04.20
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3000
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  tagline: ChatGPT but better
  category: ai
  developer: Mckay Wrigley
  website: https://github.com/mckaywrigley/chatbot-ui
