apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: snapdrop
  name: Snapdrop
  description: The easiest way to share files between devices
release:
  revision: "2"
  version: b8b78cc2-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    server: application
endpoints:
  web:
    service: server
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: config
    composeVolume: config
    purpose: Data at /config (server)
    retention: retain
presentation:
  icon: icon.png
  tagline: Opensource Airdrop Alternative
  category: files
  developer: RobinLinus
  website: https://snapdrop.net/
