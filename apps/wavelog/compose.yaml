services:
  app:
    image: ghcr.io/wavelog/wavelog@sha256:6d02c84188a6d4a87c641cc13b2c69de971ae3d3dc6657b9d15617230dc8cac0 # tag: 3.2.4
    environment:
      CI_ENV: docker
    volumes:
      - {type: volume, source: config, target: "/var/www/html/application/config/docker"}
      - {type: volume, source: uploads, target: "/var/www/html/uploads"}
      - {type: volume, source: userdata, target: "/var/www/html/userdata"}
    depends_on:
      wavelog-db:
        condition: service_started
  wavelog-db:
    image: mariadb@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873 # tag: 11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: yes
      MARIADB_DATABASE: wavelog
      MARIADB_USER: wavelog
      MARIADB_PASSWORD: wavelog
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  config: {}
  uploads: {}
  userdata: {}
  db: {}
