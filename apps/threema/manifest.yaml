apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: threema
  name: Threema Web
  description: The Threema Web application.
release:
  revision: "2"
  version: 2.6.5
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: An intuitive and secure web client for Threema users
  category: files
  developer: Threema GmbH
  website: https://threema.ch/
