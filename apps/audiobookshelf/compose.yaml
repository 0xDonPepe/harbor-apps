services:
  web:
    image: ghcr.io/advplyr/audiobookshelf@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b # tag: 2.37.1
    environment:
      TZ: "UTC"
    volumes:
      - {type: volume, source: config, target: /config}
      - {type: volume, source: metadata, target: /metadata}
      - {type: volume, source: audiobooks, target: /audiobooks}
      - {type: volume, source: podcasts, target: /podcasts}
volumes:
  audiobooks: {}
  config: {}
  metadata: {}
  podcasts: {}
