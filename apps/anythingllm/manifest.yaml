apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: anythingllm
  name: "AnythingLLM"
  description: "All-in-one AI workspace: chat with your documents, build agents and connect any model provider, including a local Ollama."
release:
  revision: "2"
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 3001
    scheme: http
    exposure: direct
    browserContext: secure
health:
  endpoint: web
  path: /api/ping
  expectedStatus: [200]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
setup:
  endpoint: web
  instructions: "Open AnythingLLM and follow the onboarding: pick an LLM provider (Ollama, when you linked the Ollama app: its address is filled in) and create your first workspace."
storage:
  - id: storage
    composeVolume: storage
    purpose: "Documents, vector database, users and settings"
    retention: retain
secrets:
  - id: jwt-secret
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - {service: web, environment: JWT_SECRET}
  - id: sig-key
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - {service: web, environment: SIG_KEY}
  - id: sig-salt
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - {service: web, environment: SIG_SALT}
# Optional: the shared Ollama app. AnythingLLM reads OLLAMA_BASE_PATH for its Ollama LLM provider and agents (the
# onboarding form shows it); choose Ollama as the provider to use it. Without a provider nothing changes.
links:
  - id: ollama
    purpose: "Ollama, the model server (shared by every AI app; optional)"
    optional: true
    provider:
      packages: [ollama]
      endpoint: web
    bindings:
      - {service: web, environment: OLLAMA_BASE_PATH, format: url}
presentation:
  tagline: "Chat with your documents and build AI agents"
  sizeHint: "About 2 GB, plus your documents"
  category: ai
  icon: icon.png
  developer: "Mintplex Labs"
  website: https://anythingllm.com
  releaseNotes: "AnythingLLM 1.16.1; telemetry disabled. Uses its built-in LanceDB vector store. Can link to the Ollama app for local models (optional)."
