apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: influxdb2
  name: InfluxDB 2
  description: Scalable datastore for metrics, events, and real-time analytics
release:
  revision: "1"
  version: 2.9.1-patch.1
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
endpoints:
  web:
    service: app
    containerPort: 8086
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
storage:
  - id: data
    composeVolume: data
    purpose: Data at /var/lib/influxdb2 (app)
    retention: retain
  - id: config
    composeVolume: config
    purpose: Data at /etc/influxdb2 (app)
    retention: retain
presentation:
  tagline: The leading platform for time series data
  category: developer
  developer: InfluxData
  website: https://www.influxdata.com/
