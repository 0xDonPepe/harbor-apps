services:
  web:
    image: willtda/dropgate-server@sha256:43698790fe341ea3fb0094bbdca701ecdf875a9c4b9c92b67f86c34c887c132b # tag: 3.0.13
    environment:
      SERVER_PORT: "52443"
      SERVER_NAME: Dropgate Server
      ENABLE_WEB_UI: "true"
      ENABLE_UPLOAD: "true"
      UPLOAD_ENABLE_E2EE: "true"
      UPLOAD_PRESERVE_UPLOADS: "false"
      UPLOAD_MAX_FILE_SIZE_MB: "100"
      UPLOAD_MAX_STORAGE_GB: "10"
      UPLOAD_MAX_FILE_LIFETIME_HOURS: "24"
      UPLOAD_MAX_FILE_DOWNLOADS: "1"
      ENABLE_P2P: "true"
    volumes:
      - {type: volume, source: uploads, target: "/usr/src/app/uploads"}
    healthcheck:
      disable: true
volumes:
  uploads: {}
