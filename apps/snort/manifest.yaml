apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: snort
  name: Snort
  description: Fast Nostr UI
release:
  revision: "2"
  version: 0.5.3
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 8080
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /
  expectedStatus: [200, 301, 302, 303, 307, 308, 401]
  timeoutSeconds: 5
  deadlineSeconds: 300
ui:
  primaryEndpoint: web
presentation:
  icon: icon.png
  tagline: Fast Nostr UI
  category: other
  developer: Snort
  website: https://snort.social
